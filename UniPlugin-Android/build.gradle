// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        getDefaultProperties = this.&getDefaultProperties
    }

    repositories {
        google()
        mavenCentral()
        jcenter()

        maven {
            url 'https://mvnrepo.guance.com/repository/maven-releases'
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath 'com.cloudcare.ft.mobile.sdk.tracker.plugin:ft-plugin:1.3.8'


        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter()

        maven {
            url 'https://mvnrepo.guance.com/repository/maven-releases'
        }
    }
}

def getDefaultProperties() {

    Properties properties = new Properties()
    def file = project.rootProject.file('../.version')
    if (file.exists()) {
        properties.load(file.newDataInputStream())
    }
    return properties
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
