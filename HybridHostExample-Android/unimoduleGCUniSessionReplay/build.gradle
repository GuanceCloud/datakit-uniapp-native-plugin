plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.guance.unimodule.gcunisessionreplay'
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // DCloud Runtime classes are supplied by the Host application.
    compileOnly fileTree(dir: '../simpleDemo/libs', include: ['*.aar', '*.jar'])
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
    compileOnly 'org.jetbrains.kotlin:kotlin-reflect:2.2.0'
    compileOnly 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    compileOnly 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Guance Runtime dependencies are supplied once by the Host application.
    compileOnly 'com.alibaba:fastjson:1.1.46.android'
    compileOnly 'com.google.code.gson:gson:2.8.9'
    compileOnly 'com.squareup.okhttp3:okhttp:4.5.0'
    compileOnly 'com.cloudcare.ft.mobile.sdk.tracker.agent:ft-sdk:1.7.4'
    compileOnly 'com.cloudcare.ft.mobile.sdk.tracker.agent:ft-native:1.1.3'
    compileOnly 'com.cloudcare.ft.mobile.sdk.tracker.agent:ft-session-replay:0.1.7'
}
